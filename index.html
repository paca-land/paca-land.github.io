<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaCaLand</title>
  <meta name="description" content="A small floating land. Every link grows a different one.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css?v=44">
  <!--
    three.js r170 is vendored in vendor/three (MIT, see its LICENSE): no third-party scripts at runtime.
    The ?v= numbers dodge the CDN's hours-long cache: bump them all together when the site's own files change.
  -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/",
        "./js/world.js": "./js/world.js?v=44",
        "./js/sky.js": "./js/sky.js?v=44",
        "./js/effects.js": "./js/effects.js?v=44",
        "./js/interact.js": "./js/interact.js?v=44",
        "./js/conditions.js": "./js/conditions.js?v=44",
        "./js/landmarks.js": "./js/landmarks.js?v=44",
        "./js/random.js": "./js/random.js?v=44",
        "./js/grass.js": "./js/grass.js?v=44",
        "./js/life.js": "./js/life.js?v=44",
        "./js/sound.js": "./js/sound.js?v=44",
        "./js/details.js": "./js/details.js?v=44",
        "./js/skygrab.js": "./js/skygrab.js?v=44",
        "./js/journal.js": "./js/journal.js?v=44",
        "./js/rarity.js": "./js/rarity.js?v=44",
        "./js/lexicon.js": "./js/lexicon.js?v=44",
        "./js/voyage.js": "./js/voyage.js?v=44",
        "./js/tales.js": "./js/tales.js?v=44",
        "./js/stories.js": "./js/stories.js?v=44",
        "./js/i18n.js": "./js/i18n.js?v=44",
        "./js/zh.js": "./js/zh.js?v=44"
      }
    }
  </script>
  <script type="module" src="js/main.js?v=44"></script>
</head>
<body class="in-flight">

<canvas id="world" aria-label="A small floating land. Drag to look around."></canvas>

<header class="hud-top">
  <p class="welcome"><span data-i18n>Welcome to</span> <a class="magic" href="#" title="Back to the home land">PaCaLand.</a></p>
  <h1 id="land-name">&nbsp;</h1>
  <p id="land-meta"></p>
  <p id="conditions"></p>
  <div id="rarity-why" class="rarity-why" hidden></div>
</header>

<div class="hud-bottom">
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <div id="journal" class="panel journal" hidden></div>

  <div id="panel" class="panel" hidden>
    <div class="row time-row">
      <label for="time" data-i18n>time</label>
      <input id="time" type="range" min="0" max="23.99" step="0.01">
      <output id="time-out" for="time"></output>
      <button id="live" type="button" class="chip" data-i18n>live</button>
      <button id="timelapse" type="button" class="chip" data-i18n>time lapse</button>
    </div>
    <div class="row chips" id="weather-chips"></div>
    <div class="row quality-row">
      <span data-i18n>quality</span>
      <div class="chips row" id="quality-chips"></div>
    </div>
  </div>

  <p id="hint" data-i18n>Tap trees, water and buildings · double-click to look closer</p>

  <form id="visit" class="bar">
    <input id="seed-input" type="text" maxlength="40" autocomplete="off" spellcheck="false"
           placeholder="Type any word to grow a land" aria-label="Land name or seed">
    <button type="submit" class="primary" data-i18n>visit</button>
    <button type="button" id="dice" class="icon" aria-label="Visit a random land" title="Random land">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle class="pip" cx="8.5" cy="8.5" r="1.4"/><circle class="pip" cx="12" cy="12" r="1.4"/><circle class="pip" cx="15.5" cy="15.5" r="1.4"/></svg>
    </button>
    <button type="button" id="share" class="icon" aria-label="Copy a link to this land" title="Copy link">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg>
    </button>
    <button type="button" id="sound" class="icon" aria-label="Sound" aria-pressed="false" title="Sound">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6"/><path class="wave" d="M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
    <button type="button" id="photo" class="icon" aria-label="Photo mode" title="Photo mode">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h3l1.5-2h7l1.5 2h3v10H4z"/><circle cx="12" cy="13" r="3.2"/></svg>
    </button>
    <button type="button" id="journal-button" class="icon" aria-label="Journal" aria-expanded="false" title="Journal">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10.2 5.2 7.5 4.5 4.5 4.5v13c3 0 5.7.7 7.5 2 1.8-1.3 4.5-2 7.5-2v-13c-3 0-5.7.7-7.5 2z"/><path d="M12 6.5v13"/></svg>
    </button>
    <button type="button" id="tweak" class="icon" aria-label="Play with time and weather" aria-expanded="false" title="Time &amp; weather">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
    </button>
  </form>
</div>

<div id="photo-ui" class="panel" hidden>
  <label><span data-i18n>exposure</span> <input id="photo-exposure" type="range" min="-1" max="1" step="0.05" value="0"></label>
  <label><span data-i18n>focus blur</span> <input id="photo-blur" type="range" min="0" max="14" step="0.5" value="5"></label>
  <div class="row">
    <button id="photo-save" type="button" class="chip primary-chip" data-i18n>save picture</button>
    <button id="photo-done" type="button" class="chip" data-i18n>done</button>
  </div>
</div>

<button type="button" id="lang" class="lang-switch" lang="zh-CN" title="Switch language" aria-label="Switch language">中文</button>

<p class="fallback"><span data-i18n>Welcome to</span> <span class="magic">PaCaLand.</span></p>

</body>
</html>
